<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0D1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A Little Universe for Neelu - An extraordinary interactive birthday surprise celebrating Neelam on November 18.">

  <!-- Open Graph & Social Sharing Meta Tags (for WhatsApp, Instagram, Telegram) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="A Little Universe for Neelu • Happy Birthday Neelam ✨">
  <meta property="og:description" content="An extraordinary interactive birthday surprise experience created exclusively for Neelam.">
  <meta property="og:image" content="assets/photos/photo-01.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A Little Universe for Neelu • Happy Birthday Neelam ✨">
  <meta name="twitter:description" content="An extraordinary interactive birthday surprise experience created exclusively for Neelam.">
  <meta name="twitter:image" content="assets/photos/photo-01.jpeg">

  <!-- Performance Preconnect Hints -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>A Little Universe for Neelu • Happy Birthday Neelam ✨</title>

  <!-- Favicon (Inline SVG celestial star) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFD700'><path d='M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z'/></svg>">

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Core Libraries (CDNs with robust graceful fallbacks) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Native Background Audio Element for Immediate Autoplay on Load -->
  <audio id="bgMusicEl" src="assets/music/bg-music.aac" autoplay loop playsinline preload="auto" aria-hidden="true"></audio>

  <!-- Fixed 3D Celestial Universe Canvas -->
  <canvas id="universeCanvas"></canvas>

  <!-- Ambient Ethereal Glow Orbs -->
  <div class="ambient-glow-orb orb-1"></div>
  <div class="ambient-glow-orb orb-2"></div>

  <!-- Persistent Top Header -->
  <header class="top-header">
    <div class="top-progress-track">
      <div class="top-progress-bar" id="topProgressBar"></div>
    </div>

    <div class="header-brand">
      <span class="brand-gem">✦</span>
      <span class="brand-title">A LITTLE UNIVERSE FOR NEELU</span>
    </div>

    <div class="header-controls">
      <!-- Background Music Player Widget -->
      <div class="music-player-widget" id="musicPlayerWidget">
        <button class="audio-toggle-btn" id="globalAudioToggle" title="Play / Pause Background Music" aria-label="Toggle Background Music">
          <span class="music-play-icon" id="globalAudioIcon">🎵</span>
          <span class="music-label-text" id="globalAudioLabel">Music On</span>
          <span class="music-mini-equalizer" id="headerEqualizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </span>
        </button>

        <!-- Master Volume Control -->
        <div class="volume-control-wrap" id="volumeControlWrap" title="Adjust Volume">
          <button class="vol-icon-btn" id="volumeMuteBtn" title="Mute / Unmute" aria-label="Mute / Unmute">
            <span id="volumeIcon">🔊</span>
          </button>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.65" aria-label="Volume Control">
        </div>
      </div>
    </div>
  </header>

  <!-- Main Viewport Mount (8 Scenes Render Here) -->
  <main class="app-viewport">
    <div id="sceneMount" class="scene-container"></div>
  </main>

  <!-- Persistent Floating Bottom Navigation Dock -->
  <nav class="bottom-nav-dock" id="navDock" aria-label="Scene Navigation"></nav>

  <!-- Application Modules -->
  <script src="js/config.js"></script>
  <script src="js/soundEngine.js"></script>
  <script src="js/threeUniverse.js"></script>
  <script src="js/threeCake.js"></script>
  <script src="js/fireworks.js"></script>

  <!-- Scene Components -->
  <script src="js/scenes/scene1Welcome.js"></script>
  <script src="js/scenes/scene2Envelope.js"></script>
  <script src="js/scenes/scene3Cake.js"></script>
  <script src="js/scenes/scene4Friendship.js"></script>
  <script src="js/scenes/scene5Gallery.js"></script>
  <script src="js/scenes/scene6Angel.js"></script>
  <script src="js/scenes/scene7Letter.js"></script>
  <script src="js/scenes/scene8Finale.js"></script>

  <!-- Main Controller -->
  <script src="js/app.js"></script>
</body>
</html>
